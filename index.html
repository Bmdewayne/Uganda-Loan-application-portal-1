<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uganda Loan Portal</title>

  <style>
    :root {
      --yellow: #ffcc00;
      --dark-blue: #003b5c;
      --blue: #005b82;
      --cream: #fffdf2;
      --white: #ffffff;
      --text: #222222;
      --border: #d6d6d6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 25px auto;
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .header {
      background: var(--yellow);
      padding: 24px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      color: var(--dark-blue);
      font-size: 24px;
    }

    .header p {
      margin: 8px 0 0;
      color: var(--dark-blue);
      font-size: 14px;
    }

    .content {
      padding: 25px;
    }

    .progress {
      height: 7px;
      background: #eeeeee;
      border-radius: 10px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 25%;
      background: var(--yellow);
      transition: width 0.3s ease;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    h2 {
      color: var(--dark-blue);
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: var(--dark-blue);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 15px;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--dark-blue);
    }

    textarea {
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: var(--yellow);
      color: var(--dark-blue);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      background: #e6b800;
    }

    .back {
      background: var(--dark-blue);
      color: white;
      margin-bottom: 10px;
    }

    .summary {
      background: #f2f7fa;
      border-left: 4px solid var(--yellow);
      padding: 15px;
      border-radius: 7px;
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .notice {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
